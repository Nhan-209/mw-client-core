[workspace]
members = [
    "crates/mw-sdk",
    "crates/mw-core",
    "crates/mw-loader",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["MW Custom Client Contributors"]
license = "MIT"
repository = "https://github.com/example/mw-client-core"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemServices",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }
retour = "0.3"
